[package]
name = "sdvrf"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "sdvrf"

[[bin]]
name = "dvrf_bench"
path = "src/bin/dvrf_bench.rs"

[dependencies]
ark-std = { version = "=0.5.0" }
ark-ec = { version = "0.5.0" }
ark-ff = { version = "0.5.0" }
ark-poly = { version = "0.5.0" }
ark-bls12-381 = { version = "0.5.0" }
ark-serialize = { version = "0.5.0" }
rand = "=0.8.8"
merlin = { version = "3.0.0", default-features = false }
sha2 = "=0.10.9"
zeroize = "=1.9.0"
libc = "=0.2.189"

[features]
asm = ["ark-ff/asm"]

[profile.release]
lto = "thin"
codegen-units = 1
